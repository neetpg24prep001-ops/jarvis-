<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1e3a5f">
<title>Jarvis 30-Day</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
:root{
  --bg:#fef9f0;--card:#fff;--c2:#fdf5e6;--bd:#f0d9a0;
  --ink:#1a0a00;--mt:#8b6914;
  --red:#dc2626;--gold:#d97706;--navy:#1e3a5f;
  --blue:#3b82f6;--purple:#7c3aed;--orange:#ea580c;
  --green:#059669;--hk:#f97316;--teal:#0f766e;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;font-size:14px}
.app{display:flex;flex-direction:column;height:100vh;max-width:500px;margin:0 auto}
.hdr{background:var(--navy);border-bottom:3px solid #ffd700;padding:10px 14px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
.ht{font-size:18px;font-weight:800;color:#ffd700;letter-spacing:.05em}
.hs{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#94a3b8;margin-top:2px}
.hb{background:#0f2540;border:1.5px solid #ffd700;border-radius:5px;padding:4px 10px;text-align:center}
.hbl{font-size:7px;letter-spacing:.15em;text-transform:uppercase;color:#94a3b8}
.hbv{font-size:13px;font-weight:800;color:#ffd700;line-height:1}
.tabs{background:var(--card);border-bottom:2px solid var(--bd);display:flex;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 13px;border:none;background:none;cursor:pointer;white-space:nowrap;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mt);position:relative;flex-shrink:0;font-family:inherit;touch-action:manipulation}
.tab.on{color:var(--red);font-weight:700}
.tab.on::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:2px;background:var(--red)}
.pages{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px;display:none}
.page.on{display:block}
.dots{display:flex;justify-content:center;gap:6px;padding:5px 0 3px;flex-shrink:0;background:var(--bg)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--bd);cursor:pointer;border:none;touch-action:manipulation}
.dot.on{background:var(--red);width:18px;border-radius:3px}
/* Cards */
.sc{background:var(--card);border:2px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:8px}
.sc.op{border-top:3px solid var(--red)}
.sc.gr{border-top:3px solid var(--green)}
.sc.hk{border-top:3px solid var(--hk)}
.sc.na{border-top:3px solid var(--orange)}
.sc.dt{border-top:3px solid var(--purple)}
.sc-t{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
/* Checkboxes */
.ci{display:flex;align-items:center;gap:10px;padding:10px 11px;margin-bottom:4px;background:var(--c2);border-radius:7px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;min-height:44px}
.ci.ck{background:#f0fdf4}
.cb{width:22px;height:22px;min-width:22px;border-radius:5px;border:2px solid var(--bd);background:white;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.ci.ck .cb{background:#22c55e;border-color:#22c55e;color:white}
.cl{font-size:13px;color:var(--ink);flex:1;line-height:1.4;pointer-events:none}
.ci.ck .cl{color:#15803d;text-decoration:line-through}
.cx{font-size:10px;color:var(--gold);font-weight:700;flex-shrink:0;pointer-events:none}
/* Inputs */
.ni{width:100%;background:var(--c2);border:1.5px solid var(--bd);border-radius:7px;padding:9px 11px;color:var(--ink);font-family:inherit;font-size:13px;resize:none;outline:none;margin-top:6px;display:block}
.ni:focus{border-color:var(--gold)}
.sr{display:flex;align-items:center;gap:8px;padding:8px 11px;background:var(--c2);border-radius:7px;margin-bottom:4px}
.sr-l{font-size:12px;color:var(--ink);flex:1}
.sr-i{background:white;border:1.5px solid var(--bd);border-radius:5px;padding:5px 9px;color:var(--ink);font-size:13px;width:110px;text-align:center;font-family:inherit;outline:none;flex-shrink:0}
.sr-i:focus{border-color:var(--red)}
/* Sliders */
.mr{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--c2);border-radius:7px;margin-bottom:4px}
.mr-l{font-size:12px;width:76px;flex-shrink:0}
.mr-v{font-size:15px;font-weight:700;width:36px;text-align:center;flex-shrink:0}
input[type=range]{flex:1;height:5px;cursor:pointer}
/* Score */
.sb{background:var(--navy);border:2px solid #ffd700;border-radius:8px;padding:14px;text-align:center;margin-bottom:8px}
.sp{font-size:40px;font-weight:900;color:#ffd700;line-height:1;margin-bottom:4px}
.sbar{height:8px;background:#2d3748;border-radius:4px;margin-top:10px;overflow:hidden}
.sf{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--red),#ffd700)}
/* Date nav */
.dnav{background:var(--navy);border:2px solid #ffd700;border-radius:7px;padding:9px 13px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.dnav button{background:none;border:1.5px solid #ffd700;border-radius:4px;color:#ffd700;padding:6px 13px;font-size:12px;cursor:pointer;font-family:inherit;touch-action:manipulation}
.dnav button:disabled{opacity:.25;cursor:default}
.dnav-c{text-align:center}
.dnav-l{font-size:14px;font-weight:700;color:#ffd700}
.dnav-s{font-size:9px;color:#94a3b8;margin-top:2px}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:10px}
.stc{background:var(--navy);border:2px solid #ffd700;border-radius:7px;padding:11px 8px;text-align:center}
.stv{font-size:22px;font-weight:900;color:#ffd700;line-height:1;margin-bottom:2px}
.stl{font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:#94a3b8}
/* Grid */
.g30{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin:8px 0}
.gc{aspect-ratio:1;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-weight:700;border:1.5px solid transparent}
.gc.gt{background:var(--red);color:white;border-color:#991b1b}
.gc.gf{background:#22c55e;color:white}
.gc.gp{background:#fef3c7;color:var(--gold);border-color:var(--gold)}
.gc.gm{background:#fef2f2;color:#fca5a5;border-color:#fca5a5}
.gc.gu{background:#f5f5f0;color:#d4c4a0}
/* Habit bars */
.hbr{margin-bottom:7px}
.hbt{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px}
.hbk{height:5px;background:var(--bd);border-radius:3px;overflow:hidden}
.hbf{height:100%;border-radius:3px}
/* Wanted */
.wanted{background:var(--c2);border:2.5px solid #ffd700;border-radius:10px;padding:16px;margin-bottom:10px;text-align:center;box-shadow:3px 3px 0 var(--gold)}
/* Crew */
.cg{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin-bottom:10px}
.cc{background:var(--card);border:2px solid var(--bd);border-radius:8px;padding:10px;text-align:center}
.cc.lk{opacity:.35;filter:grayscale(1)}
/* Revision */
.rf{background:var(--card);border:2px solid var(--bd);border-radius:8px;padding:13px;margin-bottom:10px}
.fg{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.fb{padding:5px 11px;border-radius:20px;border:1.5px solid var(--bd);background:none;color:var(--mt);font-size:11px;cursor:pointer;font-family:inherit;touch-action:manipulation}
.fb.on{color:white;border-color:transparent}
.re{background:var(--card);border:2px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:5px;display:flex;align-items:flex-start;gap:10px}
.re .ri{flex:1;min-width:0}
.re .rt2{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px}
.rsj{font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:3px;color:white;font-weight:600}
.rty{font-size:9px;text-transform:uppercase;letter-spacing:.06em}
.rty.d1{color:var(--green)}.rty.d4{color:var(--blue)}.rty.d7{color:var(--gold)}
.re .ra{display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.ck2{width:24px;height:24px;border-radius:5px;border:1.5px solid var(--bd);background:white;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;touch-action:manipulation}
.ck2.on{background:#22c55e;border-color:#22c55e;color:white}
.dl{width:22px;height:22px;border:none;background:none;color:var(--mt);cursor:pointer;font-size:18px;line-height:1;touch-action:manipulation}
/* Review */
.rv{background:var(--card);border:2px solid var(--bd);border-radius:8px;padding:13px;margin-bottom:8px}
.rq{font-size:12px;font-weight:600;color:var(--ink);margin:10px 0 5px}
.rq:first-child{margin-top:0}
.rstat{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:var(--c2);border-radius:5px;margin-bottom:3px}
/* Misc */
.sl{font-size:9px;letter-spacing:.2em;text-transform:uppercase;margin:14px 0 8px;color:var(--mt)}
.sl:first-child{margin-top:0}
.em2{padding:14px;background:var(--c2);border-radius:7px;font-size:12px;color:var(--mt);text-align:center}
.th-op{background:linear-gradient(135deg,#1e3a5f,#0f2540);border:2px solid #ffd700;color:#fff;border-radius:8px;padding:13px 15px;margin-bottom:10px}
.cc2{display:flex;gap:12px;background:var(--card);border:2px solid var(--bd);border-radius:7px;padding:11px 13px;margin-bottom:4px}
.leg{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.li{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--mt)}
.ld{width:10px;height:10px;border-radius:2px}
/* Toast */
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--navy);border:2px solid #ffd700;border-radius:7px;padding:9px 18px;color:#ffd700;font-weight:700;font-size:14px;z-index:999;pointer-events:none;white-space:nowrap;animation:tia .3s ease}
@keyframes tia{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
/* Modal */
.mov{position:fixed;inset:0;background:#00000099;display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--c2);border:2.5px solid #ffd700;border-radius:12px;padding:22px;width:100%;max-width:360px;text-align:center;box-shadow:5px 5px 0 var(--gold)}
.modal h2{font-size:22px;font-weight:900;color:var(--red);margin-bottom:6px}
.modal p{font-size:13px;color:var(--mt);line-height:1.6;margin-bottom:16px}
.mbr{display:flex;gap:8px}
.mbr button{flex:1;padding:11px;border:none;border-radius:7px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;touch-action:manipulation}
.btn-p{background:var(--red);color:white}
.btn-s{background:white;color:var(--mt);border:1.5px solid var(--bd) !important}
.btn-ok{width:100%;padding:12px;border:none;border-radius:7px;background:var(--red);color:white;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;touch-action:manipulation}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div>
      <div class="ht">JARVIS 30-DAY</div>
      <div class="hs" id="hdr-sub">APRIL 2026</div>
    </div>
    <div class="hb">
      <div class="hbl">BOUNTY</div>
      <div class="hbv" id="bounty-val">0฿</div>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="pages" id="pages"></div>
  <div class="dots" id="dots"></div>
</div>

<script>
// ═══════════════════════════════════════════════
// JARVIS 30-DAY — Vanilla JS, Zero Dependencies
// ═══════════════════════════════════════════════

// ── Data ─────────────────────────────────────────
const KEY = 'jarvis-master';
const VER = 2;

function fresh() { return {version:VER,days:{},revs:[],nid:1,rvws:{}}; }

function migrate(raw) {
  if (!raw) return fresh();
  let d; try { d = JSON.parse(raw); } catch { return fresh(); }
  if (!d.version) d = {version:1,days:d.days||d.dayData||{},revs:d.revs||d.entries||[],nid:d.nid||1,rvws:d.rvws||{}};
  if (d.version < 2) {
    const m = {Physio:'Physiology',Pharma:'Pharmacology',Patho:'Pathology',Med:'Medicine',Biochem:'Biochemistry',Micro:'Microbiology'};
    d.revs = (d.revs||[]).map(e => ({...e, subject: m[e.subject]||e.subject||'Other'}));
    d.version = 2;
  }
  return {version:VER,days:d.days||{},revs:d.revs||[],nid:d.nid||1,rvws:d.rvws||{}};
}

let S = migrate(localStorage.getItem(KEY));
let saveTimer;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch{} }, 400);
}

// ── Constants ─────────────────────────────────────
const START = new Date(2026,3,1);
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

const SUBJ = {
  'Physiology':{c:'#f43f5e',e:'🫀'},'Pharmacology':{c:'#8b5cf6',e:'⚗️'},
  'Pathology':{c:'#334155',e:'🔬'},'Medicine':{c:'#0ea5e9',e:'⚕️'},
  'PSM':{c:'#10b981',e:'📊'},'Biochemistry':{c:'#f59e0b',e:'🧬'},
  'Microbiology':{c:'#84cc16',e:'🦠'},'Anatomy':{c:'#e11d48',e:'🦴'},
  'FMT':{c:'#0891b2',e:'⚖️'},'Ophthalmology':{c:'#f97316',e:'👁️'},
  'ENT':{c:'#7c3aed',e:'👂'},'Dermatology':{c:'#db2777',e:'🧴'},
  'Anaesthesia':{c:'#64748b',e:'💉'},'Radiology':{c:'#0284c7',e:'🔭'},
  'Psychiatry':{c:'#9333ea',e:'🧠'},'Orthopaedics':{c:'#b45309',e:'🦿'},
  'Paediatrics':{c:'#16a34a',e:'👶'},'OBG':{c:'#be185d',e:'🌸'},
  'Surgery':{c:'#dc2626',e:'🔪'},'Other':{c:'#6b7280',e:'📚'}
};

const RANKS = [
  {name:'East Blue Rookie',min:0,bounty:'0',emoji:'📖'},
  {name:'Pirate',min:200,bounty:'10M',emoji:'⚡'},
  {name:'Super Rookie',min:500,bounty:'50M',emoji:'🔥'},
  {name:'Grand Line Capt',min:900,bounty:'150M',emoji:'💪'},
  {name:'New World Pirate',min:1400,bounty:'500M',emoji:'👑'},
  {name:'Yonko Commander',min:2000,bounty:'1B',emoji:'🏆'},
  {name:'PIRATE KING',min:2800,bounty:'INF',emoji:'🏆'},
];

const XPM = {water500:10,yoga:20,posture:10,workout:30,'left-8am':20,'study-ontime':25,water3l:10,nojunk:15,nosugar:15,protein:10,skincare:5,sunscreen:5,sleep1130:15,noscreen_am:20,noscreen_pm:15,journaled:20};
const HABITS = Object.keys(XPM);

const CREW = [
  {name:'Zoro',emoji:'⚔️',xp:0,color:'#22c55e',role:'First Mate'},
  {name:'Nami',emoji:'🌊',xp:200,color:'#f59e0b',role:'Navigator'},
  {name:'Usopp',emoji:'🎯',xp:500,color:'#84cc16',role:'Sniper'},
  {name:'Sanji',emoji:'🦵',xp:900,color:'#eab308',role:'Cook'},
  {name:'Chopper',emoji:'🦌',xp:1400,color:'#f43f5e',role:'Doctor'},
  {name:'Robin',emoji:'🌸',xp:2000,color:'#8b5cf6',role:'Historian'},
  {name:'Franky',emoji:'🤖',xp:2800,color:'#3b82f6',role:'Shipwright'},
];

// ── Helpers ───────────────────────────────────────
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const addD = (d,n) => { const r=new Date(d); r.setDate(r.getDate()+n); return r; };
const dkey = d => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
const dayN = d => Math.round((d-START)/86400000);
const isWO = d => [2,4,6].includes(d.getDay());
const fmtD = d => `${WD[d.getDay()]}, ${d.getDate()} ${MN[d.getMonth()]}`;
const fmtS = d => `${d.getDate()} ${MN[d.getMonth()]}`;
const fromK = k => { const [y,m,d]=k.split('-').map(Number); return new Date(y,m,d); };
const getRank = xp => { for(let i=RANKS.length-1;i>=0;i--) if(xp>=RANKS[i].min) return RANKS[i]; return RANKS[0]; };
const getNext = xp => RANKS.find(r=>r.min>xp)||null;
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function calcXP() {
  let x=0;
  Object.values(S.days).forEach(d=>Object.entries(d?.checks||{}).forEach(([k,v])=>{if(v&&XPM[k])x+=XPM[k];}));
  S.revs.forEach(r=>{if(r.d1done)x+=20;if(r.d4done)x+=30;if(r.d7done)x+=50;});
  return x;
}

function getScore(dd) {
  const done=HABITS.filter(k=>dd?.checks?.[k]).length;
  return {done,total:HABITS.length,pct:Math.round(done/HABITS.length*100)};
}

// ── UI State ──────────────────────────────────────
let TAB = 0;
let VD = today();
let RFILT = 'Today';
let RSUBJ = 'Pharmacology';
let RVTYPE = 'daily';
let prevXP = calcXP();

const TABS = ['📅 Today','📊 Tracker','🔁 1·4·7','📋 Review','🏴 Log'];

// ── Toast ─────────────────────────────────────────
function toast(msg) {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),1800);
}

// ── Modal ─────────────────────────────────────────
function modal(html) {
  const o = document.createElement('div');
  o.className='mov';
  o.innerHTML=`<div class="modal">${html}</div>`;
  o.addEventListener('click',e=>{if(e.target===o)o.remove();});
  document.body.appendChild(o);
  return o;
}

// ── Rank check ────────────────────────────────────
function checkRank() {
  const nx=calcXP(), g=nx-prevXP;
  if(g>0) toast(`+${g} XP`);
  const or=getRank(prevXP), nr=getRank(nx);
  if(nr.name!==or.name&&nx>prevXP) {
    setTimeout(()=>{
      const m=modal(`<div style="font-size:48px;margin-bottom:8px">${nr.emoji}</div>
        <h2>RANK UP!</h2>
        <p><strong>${nr.name}</strong><br>Bounty: ${nr.bounty} Berries!</p>
        <button class="btn-ok" onclick="this.closest('.mov').remove()">YOSH! LET'S GO!</button>`);
    },600);
  }
  prevXP=nx;
}

// ── Render header ─────────────────────────────────
function renderHeader() {
  const xp=calcXP(), rank=getRank(xp), dn=dayN(today());
  document.getElementById('hdr-sub').textContent=`APRIL 2026 · ${dn>=0&&dn<30?`DAY ${dn+1}/30`:'VOYAGE'}`;
  document.getElementById('bounty-val').textContent=rank.bounty+'฿';
}

// ── Switch tab (fast, no rebuild) ─────────────────
function goTab(i) {
  TAB=i;
  document.querySelectorAll('.page').forEach((p,j)=>p.classList.toggle('on',j===i));
  document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('on',j===i));
  document.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===i));
  document.querySelectorAll('.tab')[i]?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  renderHeader();
}

// ── Rerender single page ──────────────────────────
function rr(i) {
  const el=document.getElementById('p'+i);
  if(!el) return;
  const st=el.scrollTop;
  el.innerHTML=buildPage(i);
  el.scrollTop=st;
  renderHeader();
  // Update tab badge
  const rp=pendingRevs();
  document.querySelectorAll('.tab')[2].textContent=`🔁 1·4·7${rp>0?` (${rp})`:''}`;
}

function pendingRevs() {
  const tk=dkey(today());
  return S.revs.filter(r=>(r.studyDate===tk&&!r.d1done)||(r.rev1Date===tk&&!r.d4done)||(r.rev2Date===tk&&!r.d7done)).length;
}

// ── Full render (once on load) ────────────────────
function fullRender() {
  // Tabs
  const rp=pendingRevs();
  const labels=[...TABS]; labels[2]=`🔁 1·4·7${rp>0?` (${rp})`:''}`;
  document.getElementById('tabs').innerHTML=labels.map((l,i)=>`<button class="tab${TAB===i?' on':''}" data-t="${i}">${l}</button>`).join('');
  // Pages
  document.getElementById('pages').innerHTML=TABS.map((_,i)=>`<div class="page${TAB===i?' on':''}" id="p${i}">${buildPage(i)}</div>`).join('');
  // Dots
  document.getElementById('dots').innerHTML=TABS.map((_,i)=>`<button class="dot${TAB===i?' on':''}" data-t="${i}"></button>`).join('');
  renderHeader();
}

// ── Build page content ────────────────────────────
function buildPage(i) {
  try {
    if(i===0) return buildToday();
    if(i===1) return buildTracker();
    if(i===2) return buildRevision();
    if(i===3) return buildReview();
    if(i===4) return buildLog();
  } catch(e) { return `<div style="padding:20px;color:red">Error: ${e.message}</div>`; }
  return '';
}

// ══════════════════════════════════════════════════
// TRACKER PAGE
// ══════════════════════════════════════════════════
function buildTracker() {
  const NOW=today();
  const scores=Array.from({length:30},(_,i)=>getScore(S.days[dkey(addD(START,i))]||{}));
  const el=Math.max(1,Array.from({length:30},(_,i)=>addD(START,i)).filter(d=>d<=NOW).length);
  const avg=Math.round(scores.slice(0,el).reduce((a,s)=>a+s.pct,0)/el);
  const perf=scores.filter((s,i)=>addD(START,i)<=NOW&&s.pct===100).length;
  let str=0,sd=new Date(NOW);
  while(sd>=START){const{pct}=getScore(S.days[dkey(sd)]||{});if(pct===100){str++;sd.setDate(sd.getDate()-1);}else break;}

  const grid=Array.from({length:30},(_,i)=>{
    const d=addD(START,i),isT=dkey(d)===dkey(NOW),isF=d>NOW;
    const{pct}=scores[i];
    const cl=isT?'gt':isF?'gu':pct===100?'gf':pct>0?'gp':'gm';
    return `<div class="gc ${cl}">${d.getDate()}${!isF&&!isT?`<span style="font-size:7px;display:block">${pct}%</span>`:''}</div>`;
  }).join('');

  const bars=[
    ['💧 Water 500ml','water500','var(--green)'],['🌊 Yoga','yoga','var(--green)'],
    ['⚔️ Workout','workout','var(--red)'],['📖 Study on time','study-ontime','var(--red)'],
    ['💧 Water 3L','water3l','var(--hk)'],['🥦 No junk','nojunk','var(--hk)'],
    ['✨ Skincare','skincare','var(--hk)'],['🌙 Sleep 11:30','sleep1130','var(--blue)'],
    ['📵 No screen AM','noscreen_am','var(--purple)'],['📝 Journaled','journaled','var(--orange)'],
  ].map(([l,id,c])=>{
    const d=Array.from({length:30},(_,i)=>addD(START,i)).filter(d=>d<=NOW&&S.days[dkey(d)]?.checks?.[id]).length;
    return `<div class="hbr"><div class="hbt"><span>${l}</span><span style="color:${c};font-weight:600">${d}/${el}d</span></div>
    <div class="hbk"><div class="hbf" style="width:${Math.round(d/el*100)}%;background:${c}"></div></div></div>`;
  }).join('');

  return `
  <div class="stats">
    <div class="stc"><div class="stv">${str}</div><div class="stl">🔥 Streak</div></div>
    <div class="stc"><div class="stv">${avg}%</div><div class="stl">📊 Avg</div></div>
    <div class="stc"><div class="stv">${perf}</div><div class="stl">⭐ Perfect</div></div>
  </div>
  <div class="sl" style="color:var(--red)">30-Day Grand Line Map</div>
  <div class="g30">${grid}</div>
  <div class="leg">
    <div class="li"><div class="ld" style="background:#22c55e"></div>100%</div>
    <div class="li"><div class="ld" style="background:#fef3c7;border:1px solid var(--gold)"></div>Partial</div>
    <div class="li"><div class="ld" style="background:#fef2f2;border:1px solid #fca5a5"></div>Missed</div>
    <div class="li"><div class="ld" style="background:#f5f5f0"></div>Upcoming</div>
  </div>
  <div class="sl" style="color:var(--hk);margin-top:16px">Habit Consistency</div>
  ${bars}
  <div style="height:20px"></div>`;
}

function buildRevision() {

  const defDate=`${td.getFullYear()}-${String(td.getMonth()+1).padStart(2,'0')}-${String(td.getDate()).padStart(2,'0')}`;

  const usedSubjs=[...new Set(S.revs.map(r=>r.subject))].filter(s=>SUBJ[s]);
  const filtBtns=['Today','All',...usedSubjs].map(f=>{
    const s=SUBJ[f];
    return `<button class="fb${RFILT===f?' on':''}" style="${RFILT===f?`background:${s?.c||'var(--red)'};border-color:${s?.c||'var(--red)'}`:''}" data-rf="${f}">${f}</button>`;

  let items=[];

      if(r.rev1Date===tk)  items.push({r,t:'d4',f:'d4done',d:r.d4done,l:'🔁 Day 4'});

      items.push({r,t:'d4',f:'d4done',d:r.d4done,l:'🔁 D4'});
      items.push({r,t:'d7',f:'d7done',d:r.d7done,l:'⚡ D7'});

    S.revs.filter(r=>r.subject===RFILT).forEach(r=>{
      items.push({r,t:'d1',f:'d1done',d:r.d1done,l:'📖 D1'});
      items.push({r,t:'d4',f:'d4done',d:r.d4done,l:'🔁 D4'});
      items.push({r,t:'d7',f:'d7done',d:r.d7done,l:'⚡ D7'});
    });
  }

  const itemsHtml=items.length===0
    ?`<div class="em2">${RFILT==='Today'?'No revisions due today. Add above.':'No topics yet.'}</div>`
    :items.map(({r,t,f,d,l})=>{
      const sj=SUBJ[r.subject]||SUBJ.Other, xv=t==='d7'?50:t==='d4'?30:20;
      return `<div class="re"><div class="ri">
        <div class="rt2"><span class="rsj" style="background:${sj.c}">${sj.e} ${r.subject}</span><span class="rty ${t}">${l}</span></div>

        ${t!=='d1'?`<div style="font-size:10px;color:var(--mt)">Studied: ${fmtS(fromK(r.studyDate))}</div>`:''}
        <div style="font-size:10px;color:#d97706;font-weight:700">+${xv} Berries</div>
      </div><div class="ra">
        <button class="ck2${d?' on':''}" data-rck="${r.id}" data-f="${f}">${d?'✓':''}</button>
        <button class="dl" data-del="${r.id}">×</button>

    }).join('');

  return `

    <div style="font-size:18px;font-weight:800;margin-bottom:3px">🍎 Devil Fruit Mastery</div>

  </div>
  <div class="rf">
    <div style="font-size:16px;font-weight:800;color:var(--red);margin-bottom:10px">+ Awaken New Ability</div>

      <input type="date" id="rd" value="${defDate}" style="flex:1;padding:8px 10px;border-radius:6px;border:1.5px solid var(--bd);background:var(--c2);color:var(--ink);font-family:inherit;font-size:13px;outline:none">

    <div class="fg">${subjBtns}</div>

    ['🌙','Sleep by 11:30 PM','Fat loss + NEET memory.'],
    ['📵','No screen first 2 hours','BDNF peaks — protect this.'],
  ].map(([e,t,b])=>`<div class="cc2"><span style="font-size:20px">${e}</span><div>
    <div style="font-size:13px;font-weight:600;color:var(--navy);margin-bottom:2px">${t}</div>
    <div style="font-size:11px;color:var(--mt)">${b}</div>
  </div></div>`).join('');

  return `
  <div class="wanted">
    <div style="font-size:10px;letter-spacing:.3em;color:var(--mt);font-weight:600">— WANTED —</div>
    <div style="font-size:54px;margin:8px 0;line-height:1">🏴</div>
    <div style="font-size:10px;letter-spacing:.3em;color:var(--mt);font-weight:600;margin-bottom:4px">MONKEY D. LUFFY</div>
    <div style="font-size:19px;font-weight:800;color:var(--red);margin-bottom:2px">${rank.name}</div>
    <div style="font-size:32px;font-weight:900;color:var(--navy);line-height:1">${rank.bounty}</div>
    <div style="font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mt);margin-bottom:10px">BERRIES</div>
    <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--mt);margin-bottom:4px">
      <span>${xp} XP</span><span>${next?`${next.min-xp} XP to "${next.name}"`:'MAX RANK!'}</span>
    </div>
    <div style="height:8px;background:#f0d9a0;border-radius:4px;overflow:hidden;border:1px solid var(--gold)">
      <div style="height:100%;width:${Math.min(100,pct)}%;background:linear-gradient(90deg,var(--red),#ffd700);border-radius:4px"></div>
    </div>
  </div>
  <div class="stats">
    <div class="stc"><div class="stv">${str}</div><div class="stl">🔥 Streak</div></div>
    <div class="stc"><div class="stv">${xp}</div><div class="stl">⚡ XP</div></div>
    <div class="stc"><div class="stv">${Math.max(0,dayN(today())+1)}/30</div><div class="stl">⚓ Day</div></div>
  </div>
  <div class="sl" style="color:var(--red)">Your Crew</div>
  <div class="cg">${crew}</div>
  <div class="sl" style="color:var(--red)">⚓ Pirate Code</div>
  ${code}
  <div style="height:20px"></div>`;
}

// ══════════════════════════════════════════════════
// EVENT HANDLING — single delegation
// ══════════════════════════════════════════════════
document.addEventListener('click', function(e) {
  // Tab click
  const tab=e.target.closest('[data-t]');
  if(tab){ goTab(+tab.dataset.t); return; }

  // Habit checkbox
  const ci=e.target.closest('[data-chk]');
  if(ci){
    const key=ci.dataset.key, id=ci.dataset.chk;
    if(!S.days[key]) S.days[key]={};
    if(!S.days[key].checks) S.days[key].checks={};
    S.days[key].checks[id]=!S.days[key].checks[id];
    save(); checkRank(); rr(0); return;
  }

  // Revision checkbox
  const rck=e.target.closest('[data-rck]');
  if(rck){
    const id=+rck.dataset.rck, f=rck.dataset.f;
    const rv=S.revs.find(r=>r.id===id);
    if(rv){ rv[f]=!rv[f]; save(); checkRank(); rr(TAB); } return;
  }

  // Delete revision
  const dl=e.target.closest('[data-del]');
  if(dl){
    const id=+dl.dataset.del;
    const m=modal(`<h2>Abandon?</h2><p>Removes topic + all 3 revisions.</p>
      <div class="mbr">
        <button class="btn-s" onclick="this.closest('.mov').remove()">Cancel</button>
        <button class="btn-p" id="cdel">Delete</button>
      </div>`);
    m.querySelector('#cdel').addEventListener('click',()=>{ S.revs=S.revs.filter(r=>r.id!==id); save(); m.remove(); rr(TAB); });
    return;
  }

  // Add revision
  if(e.target.id==='addrv'){
    const txt=(document.getElementById('rt')?.value||'').trim();
    const ds=document.getElementById('rd')?.value||'';
    if(!txt) return;
    const [y,m,d]=ds.split('-').map(Number);
    const sd=new Date(y,m-1,d); sd.setHours(0,0,0,0);
    S.revs.push({id:S.nid++,text:txt,subject:RSUBJ,
      studyDate:dkey(sd),rev1Date:dkey(addD(sd,3)),rev2Date:dkey(addD(sd,6)),
      d1done:false,d4done:false,d7done:false});
    save(); checkRank(); rr(2); return;
  }

  // Revision subject buttons
  const rs=e.target.closest('[data-rs]');
  if(rs){ RSUBJ=rs.dataset.rs; rr(2); return; }

  // Revision filter
  const rf=e.target.closest('[data-rf]');
  if(rf){ RFILT=rf.dataset.rf; rr(2); return; }

  // Review type
  const rvt=e.target.closest('[data-rvt]');
  if(rvt){ RVTYPE=rvt.dataset.rvt; rr(3); return; }

  // Date nav
  if(e.target.id==='pd'){ VD=addD(VD,-1); rr(0); return; }
  if(e.target.id==='nd'){ VD=addD(VD,1);  rr(0); return; }
});

// Input changes (text fields + sliders + textareas)
document.addEventListener('input', function(e) {
  // Day fields
  const el=e.target;
  if(el.dataset.key && el.dataset.f) {
    const key=el.dataset.key, f=el.dataset.f;
    if(!S.days[key]) S.days[key]={};
    S.days[key][f] = el.dataset.num ? Number(el.value) : el.value;
    // Live update slider display
    if(f==='mood'){ const mv=document.getElementById('mv'); if(mv) mv.textContent=el.value+'/10'; }
    if(f==='energy'){ const ev=document.getElementById('ev'); if(ev) ev.textContent=el.value+'/10'; }
    save(); return;
  }
  // Review fields
  if(el.dataset.rvk && el.dataset.rvq) {
    const rk=el.dataset.rvk, qk=el.dataset.rvq;
    if(!S.rvws[rk]) S.rvws[rk]={};
    S.rvws[rk][qk]=el.value;
    save(); return;
  }
});

// ── Swipe ─────────────────────────────────────────
(function(){
  const pages=document.getElementById('pages');
  let sx=null, sy=null, lock=null;
  pages.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;lock=null;},{passive:true});
  pages.addEventListener('touchmove',e=>{
    if(sx===null) return;
    const dx=e.touches[0].clientX-sx, dy=e.touches[0].clientY-sy;
    if(!lock&&(Math.abs(dx)>8||Math.abs(dy)>8)) lock=Math.abs(dx)>Math.abs(dy)?'h':'v';
    if(lock==='h') e.preventDefault();
  },{passive:false});
  pages.addEventListener('touchend',e=>{
    if(lock!=='h'||sx===null){sx=null;return;}
    const dx=e.changedTouches[0].clientX-sx;
    if(Math.abs(dx)>50) goTab(dx<0?Math.min(TABS.length-1,TAB+1):Math.max(0,TAB-1));
    sx=null; lock=null;
  },{passive:true});
})();

// ── Init ──────────────────────────────────────────
fullRender();
</script>
